  <text x="1010" y="220" text-anchor="middle" fill="#647581" font-family="Arial,Helvetica,sans-serif" font-size="13">endpoint</text>
  <path d="M1048 169H1095" fill="none" stroke="#18303C" stroke-width="2"/>
  <path d="M1095 169l-9-5v10z" fill="#18303C"/>
