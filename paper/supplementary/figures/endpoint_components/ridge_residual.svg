<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180mm" height="65.75mm" viewBox="0 0 720 263"><title>Ridge + neural residual</title><defs><radialGradient id="atomC" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#CFD7DD"/><stop offset=".45" stop-color="#5E6F7B"/><stop offset="1" stop-color="#243D4B"/></radialGradient><radialGradient id="atomN" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#B7DAF6"/><stop offset=".45" stop-color="#3C83B9"/><stop offset="1" stop-color="#19496F"/></radialGradient><radialGradient id="atomO" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#F5C4B9"/><stop offset=".45" stop-color="#D76D58"/><stop offset="1" stop-color="#923E31"/></radialGradient><radialGradient id="atomH" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#EFF2F4"/><stop offset="1" stop-color="#B8C3CB"/></radialGradient></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="720" height="263" rx="0" fill="white" stroke="none" opacity="1"/><text x="12" y="27.000" font-size="20" fill="#172D3A" font-weight="700" text-anchor="start"></text><text x="39" y="26.000" font-size="15" fill="#172D3A" font-weight="600" text-anchor="start">Ridge + neural residual</text><text x="39" y="48.000" font-size="11.5" fill="#657782" font-weight="400" text-anchor="start">Combine a continuous baseline with a learned correction.</text><path d="M39,210 L85,210" fill="none" stroke="#078774" stroke-width="2"/><text x="39" y="230.000" font-size="11.8" fill="#078774" font-weight="600" text-anchor="start">Size-held-out MAE 1.391 · No tree-leaf ceiling in the correction</text><text x="39" y="249.000" font-size="10.7" fill="#657782" font-weight="400" text-anchor="start">A linear trend is not a validated asymptotic free-energy law.</text><rect x="169" y="82" width="159" height="41" rx="5" fill="#FFFFFF" stroke="#3F7FAD" opacity="1"/><path d="M170,88 L170,117" fill="none" stroke="#3F7FAD" stroke-width="2.5"/><text x="248.5" y="106.500" font-size="12" fill="#3F7FAD" font-weight="600" text-anchor="middle">Ridge baseline</text><rect x="169" y="156" width="159" height="41" rx="5" fill="#FFFFFF" stroke="#078774" opacity="1"/><path d="M170,162 L170,191" fill="none" stroke="#078774" stroke-width="2.5"/><text x="248.5" y="180.500" font-size="12" fill="#078774" font-weight="600" text-anchor="middle">Neural residual</text><text x="23" y="99.000" font-size="11.5" fill="#3F7FAD" font-weight="600" text-anchor="start">Continuous</text><text x="23" y="114.000" font-size="11.5" fill="#3F7FAD" font-weight="600" text-anchor="start">descriptors</text><text x="23" y="181.000" font-size="11.5" fill="#078774" font-weight="600" text-anchor="start">All features</text><path d="M116,102.5 L169,102.5" fill="none" stroke="#3F7FAD" stroke-width="1.5"/><path d="M163.5,104.8 L169,102.5 L163.5,100.2 Z" fill="#3F7FAD" stroke="#3F7FAD" stroke-width="0" opacity="1"/><path d="M116,176.5 L169,176.5" fill="none" stroke="#078774" stroke-width="1.5"/><path d="M163.5,178.8 L169,176.5 L163.5,174.2 Z" fill="#078774" stroke="#078774" stroke-width="0" opacity="1"/><circle cx="557.000" cy="139.000" r="11.000" fill="white" stroke="#078774" stroke-width="1.4" opacity="1"/><text x="557" y="144.000" font-size="20" fill="#078774" font-weight="400" text-anchor="middle">+</text><path d="M328,102.5 L557,102.5" fill="none" stroke="#3F7FAD" stroke-width="1.5"/><path d="M557,102.5 L557.0,128" fill="none" stroke="#3F7FAD" stroke-width="1.5"/><path d="M554.7,122.5 L557.0,128 L559.3,122.5 Z" fill="#3F7FAD" stroke="#3F7FAD" stroke-width="0" opacity="1"/><path d="M328,176.5 L557,176.5" fill="none" stroke="#078774" stroke-width="1.5"/><path d="M557,176.5 L557.0,150" fill="none" stroke="#078774" stroke-width="1.5"/><path d="M559.3,155.5 L557.0,150 L554.7,155.5 Z" fill="#078774" stroke="#078774" stroke-width="0" opacity="1"/><text x="407" y="91.000" font-s