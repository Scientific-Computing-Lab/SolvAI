name: solvai-penpot

x-penpot-flags: &penpot-flags
  PENPOT_FLAGS: >-
    disable-email-verification
    disable-registration
    disable-secure-session-cookies
    enable-prepl-server
    enable-mcp

x-penpot-public-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:9001}

x-penpot-body-size: &penpot-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "367001600"

services:
  penpot-frontend:
    image: penpotapp/frontend:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PENPOT_HTTP_PORT:-9001}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    networks: [penpot]
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-body-size]

  penpot-backend:
    image: penpotapp/backend:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks: [penpot]
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-body-size]
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY in .env}
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD:?set PENPOT_DB_PASSWORD in .env}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"

  penpot-mcp:
    image: penpotapp/mcp:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    networks: [penpot]
    environment:
      PENPOT_MCP_SERVER_HOST: 0.0.0.0
      PENPOT_MCP_REMOTE_MODE: "true"

  penpot-exporter:
    image: penpotapp/exporter:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks: [penpot]
    environment:
      <<: [*penpot-public-uri]
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY in .env}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    volumes:
      - penpot_postgres:/var/lib/postgresql/data
    networks: [penpot]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD:?set PENPOT_DB_PASSWORD in .env}

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    networks: [penpot]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lfu"]

networks:
  penpot:

volumes:
  penpot_postgres:
    name: solvai_penpot_postgres
  penpot_assets:
    name: solvai_penpot_assets
