name: frozen reproducibility

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "models/**"
      - "results/**"
      - "solv_ai/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: make verify
      - name: Require deterministic generated artifacts
        run: git diff --exit-code -- results/paper_metrics.json results/paper_metrics.csv reports/PAPER_FREEZE.md audits/
