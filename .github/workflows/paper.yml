name: paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "results/**"
  pull_request:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "results/**"

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: make paper
      - name: Require deterministic tables and figures
        run: git diff --exit-code -- paper/tables figures/
