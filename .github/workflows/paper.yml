name: paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "results/**"
  pull_request:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "results/**"

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk poppler-utils qpdf texlive-latex-extra texlive-fonts-recommended
      - run: make paper
      - name: Validate compiled PDFs
        run: |
          qpdf --check paper/main.pdf
          qpdf --check paper/supplementary/supplementary.pdf
          qpdf --check paper/extended_data/ED_Table1.pdf
      - name: Require deterministic tables and figures
        # TeX embeds engine-specific font data in the standalone table PDF;
        # compilation is checked above and its generated source remains exact.
        run: git diff --exit-code -- paper/tables paper/figures paper/extended_data paper/supplementary_data figures/ ':(exclude)paper/extended_data/ED_Table1.pdf'
