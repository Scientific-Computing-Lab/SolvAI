name: paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "scripts/*endpoint*.py"
      - "scripts/*journal*.py"
      - "tests/test*publication*.py"
      - "results/**"
  pull_request:
    paths:
      - "paper/**"
      - "figures/**"
      - "scripts/make_figures.py"
      - "scripts/make_tables.py"
      - "scripts/*endpoint*.py"
      - "scripts/*journal*.py"
      - "tests/test*publication*.py"
      - "results/**"

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk poppler-utils qpdf texlive-latex-extra texlive-fonts-recommended
      - name: Compile the canonical source with supplied publication assets
        run: make journal-paper
      - name: Validate the complete journal PDF
        run: |
          qpdf --check paper/main.pdf
          uv run pytest -q tests/test_publication_structure.py tests/test_journal_artifacts.py tests/test_publication_presentation.py tests/test_endpoint_publication.py
      # Reconstruct numerical claims from frozen rows in the tests above. Exact PDF
      # bytes are not portable across font/TeX installations; editable assets remain
      # rebuildable with the documented local figure scripts.
