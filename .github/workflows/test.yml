name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check solv_ai scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/verify_artifact.py
