[project]
name = "active-solvai-v3"
version = "0.1.0"
description = "Evidence-gated adaptive trajectory-time allocation for fixed-grid hydration TI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "rdkit==2026.3.5",
  "scikit-learn==1.7.2",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/active_solvai_v3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

